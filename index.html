<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Tài Liệu Chung - Public Document & Video Sharing</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col transition-colors duration-300">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-md shadow-indigo-200">
                    <i class="fa-solid fa-folder-open text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-slate-900 tracking-tight">Kho Tài Liệu Chung</h1>
                    <p class="text-xs text-slate-500">Lưu trữ & chia sẻ file, video dung lượng lớn</p>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <!-- Status Badge -->
                <div id="connection-status" class="hidden sm:flex items-center space-x-2 px-3 py-1.5 rounded-full text-xs font-medium bg-amber-50 text-amber-700 border border-amber-200">
                    <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
                    <span id="status-text">Đang kết nối...</span>
                </div>

                <!-- Upload Button -->
                <button onclick="openUploadModal()" class="inline-flex items-center space-x-2 bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-sm font-medium shadow-sm transition-all hover:shadow">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <span>Tải lên tài liệu</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Stats Bar -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-8">
            <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center space-x-4">
                <div class="w-12 h-12 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-xl">
                    <i class="fa-solid fa-file-lines"></i>
                </div>
                <div>
                    <p class="text-xs font-medium text-slate-500 uppercase tracking-wider">Tổng số tài liệu</p>
                    <h3 id="stat-total" class="text-2xl font-bold text-slate-900">0</h3>
                </div>
            </div>

            <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center space-x-4">
                <div class="w-12 h-12 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center text-xl">
                    <i class="fa-solid fa-video"></i>
                </div>
                <div>
                    <p class="text-xs font-medium text-slate-500 uppercase tracking-wider">Tổng số Video</p>
                    <h3 id="stat-videos" class="text-2xl font-bold text-slate-900">0</h3>
                </div>
            </div>

            <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center space-x-4">
                <div class="w-12 h-12 rounded-xl bg-sky-50 text-sky-600 flex items-center justify-center text-xl">
                    <i class="fa-solid fa-globe"></i>
                </div>
                <div>
                    <p class="text-xs font-medium text-slate-500 uppercase tracking-wider">Trạng thái chia sẻ</p>
                    <h3 class="text-lg font-bold text-emerald-600 flex items-center space-x-1.5 mt-0.5">
                        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                        <span>Công khai 24/7</span>
                    </h3>
                </div>
            </div>
        </div>

        <!-- Search & Filter Bar -->
        <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm mb-8 flex flex-col md:flex-row gap-4 items-center justify-between">
            <div class="relative w-full md:w-96">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                    <i class="fa-solid fa-magnifying-glass text-sm"></i>
                </span>
                <input type="text" id="search-input" oninput="filterDocuments()" placeholder="Tìm kiếm tài liệu, video..." class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition-all">
            </div>

            <!-- Categories -->
            <div class="flex items-center space-x-1 overflow-x-auto w-full md:w-auto pb-2 md:pb-0 scrollbar-none">
                <button onclick="setCategory('all')" id="cat-all" class="category-btn px-3.5 py-2 rounded-xl text-xs font-medium bg-indigo-600 text-white transition-all whitespace-nowrap">Tất cả</button>
                <button onclick="setCategory('video')" id="cat-video" class="category-btn px-3.5 py-2 rounded-xl text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all whitespace-nowrap"><i class="fa-solid fa-video mr-1"></i>Video</button>
                <button onclick="setCategory('pdf')" id="cat-pdf" class="category-btn px-3.5 py-2 rounded-xl text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all whitespace-nowrap">PDF</button>
                <button onclick="setCategory('word')" id="cat-word" class="category-btn px-3.5 py-2 rounded-xl text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all whitespace-nowrap">Word</button>
                <button onclick="setCategory('excel')" id="cat-excel" class="category-btn px-3.5 py-2 rounded-xl text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all whitespace-nowrap">Excel</button>
                <button onclick="setCategory('image')" id="cat-image" class="category-btn px-3.5 py-2 rounded-xl text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all whitespace-nowrap">Hình ảnh</button>
                <button onclick="setCategory('code')" id="cat-code" class="category-btn px-3.5 py-2 rounded-xl text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all whitespace-nowrap">Mã nguồn</button>
                <button onclick="setCategory('other')" id="cat-other" class="category-btn px-3.5 py-2 rounded-xl text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all whitespace-nowrap">Khác</button>
            </div>
        </div>

        <!-- Document List Container -->
        <div id="document-container">
            <!-- Empty state -->
            <div id="empty-state" class="bg-white rounded-3xl border border-dashed border-slate-300 p-12 text-center">
                <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">
                    <i class="fa-solid fa-folder-open"></i>
                </div>
                <h3 class="text-base font-semibold text-slate-900 mb-1">Chưa có tài liệu hay video nào</h3>
                <p class="text-sm text-slate-500 mb-6 max-w-sm mx-auto">Hãy tải lên file hoặc video để chia sẻ cho mọi người cùng xem.</p>
                <button onclick="openUploadModal()" class="inline-flex items-center space-x-2 bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl text-sm font-medium shadow-sm transition-all">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <span>Tải lên ngay</span>
                </button>
            </div>

            <!-- Grid view -->
            <div id="document-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 hidden">
                <!-- Dynamic cards injected by JS -->
            </div>
        </div>
    </main>

    <!-- Preview Video Modal -->
    <div id="video-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-md hidden p-4">
        <div class="bg-slate-900 rounded-3xl max-w-3xl w-full p-4 shadow-2xl border border-slate-800 text-white">
            <div class="flex items-center justify-between mb-3 px-2">
                <h3 id="video-modal-title" class="font-bold text-slate-100 line-clamp-1">Xem Video</h3>
                <button onclick="closeVideoModal()" class="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="rounded-2xl overflow-hidden bg-black flex items-center justify-center max-h-[70vh]">
                <video id="video-player" controls class="w-full h-auto max-h-[70vh]"></video>
            </div>
        </div>
    </div>

    <!-- Upload Modal -->
    <div id="upload-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm hidden p-4">
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 transform transition-all">
            <div class="flex items-center justify-between mb-5">
                <h3 class="text-lg font-bold text-slate-900 flex items-center space-x-2">
                    <i class="fa-solid fa-cloud-arrow-up text-indigo-600"></i>
                    <span>Tải lên tài liệu / Video</span>
                </h3>
                <button onclick="closeUploadModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="upload-form
